<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>建築師考試｜113–114 題庫練習</title>
  <style>
    :root{--ink:#1d2b2a;--muted:#6b7772;--paper:#fbfaf6;--card:#fff;--sage:#dfe9df;--teal:#1f5d5b;--gold:#d59a4d;--line:#d9e0da;--bad:#b64b43;--good:#2c7959}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
    header{background:linear-gradient(135deg,#183f40,#2e6c67);color:white;padding:46px 6vw 42px;position:relative;overflow:hidden}header:after{content:"ARCHITECT\A EXAM";white-space:pre;position:absolute;right:7vw;bottom:-24px;font-size:64px;line-height:.86;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.08);transform:rotate(-8deg)}
    .eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:12px;opacity:.72}.hero{max-width:1180px;margin:auto;position:relative;z-index:1}.hero h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(34px,5vw,64px);line-height:1.08;margin:12px 0}.hero p{max-width:650px;color:#dce9e5;margin:0;font-size:17px}
    main{max-width:1180px;margin:0 auto;padding:28px 6vw 70px}.toolbar{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:12px;align-items:end;background:var(--card);border:1px solid var(--line);padding:18px;border-radius:18px;box-shadow:0 10px 30px rgba(29,43,42,.05);margin-top:-28px;position:relative;z-index:2}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;color:var(--ink);font:inherit}.btn{border:0;border-radius:10px;background:var(--teal);color:white;font-weight:700;padding:11px 16px;cursor:pointer;font:inherit}.btn.alt{background:#edf2ed;color:var(--teal)}.btn:hover{filter:brightness(1.05)}
    .meta{display:flex;gap:18px;align-items:center;justify-content:space-between;margin:28px 0 14px}.meta h2{font-family:Georgia,"Noto Serif TC",serif;margin:0;font-size:24px}.count{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;min-height:280px}.tag{display:inline-flex;align-self:flex-start;background:var(--sage);color:var(--teal);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.card h3{margin:13px 0 10px;font-size:17px;line-height:1.5}.options{display:grid;gap:7px;margin:4px 0 14px}.option{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;background:#fcfdfb}.option b{display:inline-block;width:22px;color:var(--gold)}.answer{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}.answer strong{color:var(--good)}.essay{color:var(--muted);font-size:13px}.quiz{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:24px 0;box-shadow:0 10px 30px rgba(29,43,42,.06)}.quiz[hidden]{display:none}.quiz-head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.quiz-title{font-family:Georgia,"Noto Serif TC",serif;font-size:22px;margin:0}.timer{font-variant-numeric:tabular-nums;color:var(--teal);font-weight:800;background:var(--sage);padding:5px 10px;border-radius:999px}.progress{height:7px;background:#edf1ed;border-radius:99px;overflow:hidden;margin:16px 0}.progress span{display:block;height:100%;background:var(--gold);transition:width .25s}.quiz-question{font-size:19px;font-weight:700;margin:18px 0}.quiz-options{display:grid;gap:10px}.quiz-options label{border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;background:#fcfdfb}.quiz-options label:hover{border-color:var(--teal);background:#f3f8f3}.quiz-options input{margin-right:8px;accent-color:var(--teal)}.quiz-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:22px}.quiz-result{background:#eef5ee;border-radius:12px;padding:14px;margin-top:18px}.quiz-result strong{font-size:22px;color:var(--teal)}.source{margin-top:28px;background:#eef3ee;border-radius:16px;padding:18px}.source h3{margin:0 0 7px}.source p{margin:0;color:var(--muted);font-size:13px}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.links a{color:var(--teal);font-size:13px;border-bottom:1px solid #9abbb4;text-decoration:none}.empty{padding:45px;text-align:center;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}.note{font-size:12px;color:var(--muted);margin-top:20px}.brandmark{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 9px;font-size:12px;margin-left:8px}@media(max-width:820px){.toolbar{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.toolbar{grid-template-columns:1fr}.meta{align-items:flex-start;flex-direction:column}.quiz-head,.quiz-foot{align-items:flex-start;flex-direction:column}}
    .result-message{font-family:Georgia,"Noto Serif TC",serif;font-size:20px;color:var(--teal);margin:4px 0 8px}.score-summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.score-summary span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;color:var(--muted)}.practice-actions{display:flex;align-items:center;gap:12px;margin:22px 0}.practice-result{background:#eef5ee;border-radius:12px;padding:14px;flex:1}.practice-result[hidden]{display:none}.practice-options label{display:block;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;background:#fcfdfb;cursor:pointer}.practice-options label:hover{border-color:var(--teal);background:#f3f8f3}.practice-options input{margin-right:8px;accent-color:var(--teal)}
  </style>
</head>
<body>
<header><div class="hero"><div class="eyebrow">ARCHITECT EXAM ARCHIVE <span class="brandmark">113 — 114</span></div><h1>建築師考試<br>題庫練習室</h1><p>以考選部公開試題為索引，整理四科非設計類科的題目與標準答案。選科目、選年度，立即自由出題。</p></div></header>
<main>
  <section class="toolbar" aria-label="題庫篩選">
    <div class="field"><label for="subject">科目</label><select id="subject"><option value="all">全部科目</option><option>營建法規與實務</option><option>建築結構</option><option>建築構造與施工</option><option>建築環境控制</option></select></div>
    <div class="field"><label for="year">年度</label><select id="year"><option value="all">113、114 年</option><option value="114">114 年</option><option value="113">113 年</option></select></div>
    <div class="field"><label for="kind">題型</label><select id="kind"><option value="all">全部測驗題</option><option value="choice">測驗題</option></select></div>
    <button class="btn" id="draw">自由出題</button>
    <button class="btn alt" id="quizStart">即時測驗</button>
  </section>
  <section class="quiz" id="quiz" hidden aria-live="polite">
    <div class="quiz-head"><h2 class="quiz-title">即時測驗</h2><div class="timer" id="timer">05:00</div></div>
    <div class="progress"><span id="progressBar" style="width:0%"></span></div>
    <div class="count" id="quizProgress"></div>
    <div class="quiz-question" id="quizQuestion"></div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-foot"><button class="btn alt" id="quizExit">返回題庫</button><button class="btn" id="quizNext">下一題</button></div>
    <div class="quiz-result" id="quizResult" hidden></div>
  </section>
  <div class="meta"><h2 id="title">全部題庫</h2><div class="count" id="count"></div></div>
  <section class="grid" id="questions"></section>
  <div class="practice-actions"><button class="btn" id="gradePractice">統計圈選結果</button><div class="practice-result" id="practiceResult" hidden></div></div>
  <section class="source"><h3>官方資料與使用說明</h3><p>本頁已排除申論題，僅保留測驗題；題目文字與測驗題答案以考選部「考畢試題查詢平台」公開 PDF 為依據。</p><div class="links" id="links"></div></section>
  <p class="note">本頁為學習整理工具，法規題應以考試當時及現行法規版本交叉確認；完整原始試卷請點選上方官方 PDF。</p>
</main>
<script>
const examBase='https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?c=801&q=1';
const subjects={
 '營建法規與實務':{code:'1801',s:'0101',type:'choice'},'建築結構':{code:'2801',s:'0102',type:'mixed'},'建築構造與施工':{code:'3801',s:'0103',type:'choice'},'建築環境控制':{code:'4801',s:'0104',type:'mixed'}
};
const data=[
 {y:'114',s:'營建法規與實務',k:'choice',n:1,q:'依建築法規定，下列敘述何者錯誤？',o:['建築基地，為供建築物本身所占之地面及其所應留設之法定空地','應留設之法定空地，非依規定不得移轉','法定空地之留設，應包括建築物與其前後左右之道路或其他建築物間之距離','法定空地之分割要件及申請核發程序等事項之辦法，由該管直轄市、縣（市）主管建築機關定之'],a:'D'},
 {y:'114',s:'建築結構',k:'essay',n:1,q:'一長度為 8 m 的鋼棒受到下圖的荷重，鋼棒剖面積為 1800 mm²，E = 205 GPa，其自由端（D 點）變位約為多少？（20 分）',a:'申論題；考選部未公布單一標準答案。'},
 {y:'114',s:'建築構造與施工',k:'choice',n:1,q:'依據下圖中之衝擊韌性試片結果圖，假設於相同溫度下，試由高至低順序排列出該試片衝擊韌性值結果之大小，下列選項中何者正確？',o:['(1)＞(2)＞(3)','(3)＞(2)＞(1)','(2)＞(1)＞(3)','(2)＞(3)＞(1)'],a:'B'},
 {y:'114',s:'建築環境控制',k:'essay',n:1,q:'某校園室內體育館採用大瓦數燈具之直接照明方式，為避免球賽時常產生眩光的現象，試提出照明設計之具體改善對策。（10 分）',a:'申論題；考選部未公布單一標準答案。'},
 {y:'114',s:'建築環境控制',k:'choice',n:2,q:'關於熱舒適指標 PMV-PPD 評價法，下列敘述何者錯誤？',o:['熱舒適感知主要由皮膚溫度以及汗水產生率決定','熱舒適是一種主觀的感知','PMV 與身體承受的熱應力成正比','當衣著太厚重，PMV 公式不再準確'],a:'A'},
 {y:'113',s:'營建法規與實務',k:'choice',n:1,q:'依建築法規定，申請建造執照之建築物平面、立面、剖面圖，其比例尺最小不得小於多少？',o:['1/30','1/50','1/100','1/200'],a:'B'},
 {y:'113',s:'建築結構',k:'essay',n:1,q:'如圖所示為一左右完全對稱之桁架，B 點承受 36 kN 之集中載重，各桿件的 AE 值均相同，試回答：該桁架的穩定性及靜定性、零桿件，以及 BD 及 BE 桿件的內力。（20 分）',a:'申論題；考選部未公布單一標準答案。'},
 {y:'113',s:'建築構造與施工',k:'choice',n:1,q:'下列有關鋼材一般力學性能特性之描述何者錯誤？',o:['鋼材降伏強度愈高，伸長率趨於愈低','鋼材降伏強度愈高，降伏比趨於愈高','鋼材降伏強度愈低，鋼板厚度方向斷面縮率趨於愈高','鋼材降伏強度愈低，應變硬化趨於愈顯著'],a:'C'},
 {y:'113',s:'建築環境控制',k:'essay',n:1,q:'有關綠建築評估之基地保水指標：何謂景觀貯留滲透水池？導入基地保水設計時應注意哪些重點？（20 分）',a:'申論題；考選部未公布單一標準答案。'},
 {y:'113',s:'建築環境控制',k:'choice',n:1,q:'關於空氣線圖（Psychrometric chart）的基本判讀，下列何者錯誤？',o:['乾球溫度上升、絕對濕度不變時，熱焓上升','乾球溫度不變、絕對濕度上升時，熱焓上升','乾球溫度上升、絕對濕度不變時，相對濕度上升','乾球溫度不變、絕對濕度上升時，相對濕度上升'],a:'C'}
];
const $=id=>document.getElementById(id); const rand=a=>a[Math.floor(Math.random()*a.length)];
let quizItems=[], quizIndex=0, quizAnswers=[], quizSeconds=300, quizClock=null;
function links(){let html=''; for(const y of ['114','113'])for(const s of Object.keys(subjects)){const x=subjects[s]; const code=y==='114'?'114180':'113190'; html+=`<a target="_blank" rel="noopener" href="${examBase}&code=${code}&s=${x.s}&t=Q">${y} ${s}｜試題</a>`} $('links').innerHTML=html}
function render(){let s=$('subject').value,y=$('year').value,k=$('kind').value; let list=data.filter(x=>x.k==='choice'&&(s==='all'||x.s===s)&&(y==='all'||x.y===y)&&(k==='all'||x.k===k)); if($('draw').dataset.draw==='1')list=[...list].sort(()=>Math.random()-.5).slice(0,5); $('title').textContent=`${s==='all'?'全部科目':s} · ${y==='all'?'113、114 年':y+' 年'}`; $('count').textContent=`${list.length} 題（已排除申論題）`; $('practiceResult').hidden=true; $('questions').innerHTML=list.length?list.map((x,i)=>`<article class="card"><span class="tag">${x.y}｜${x.s}｜測驗題</span><h3>${i+1}. ${x.q}</h3><div class="options practice-options">${x.o.map((v,j)=>`<label><input type="radio" name="practice-${i}" value="${'ABCD'[j]}"><b>${'ABCD'[j]}</b>${v}</label>`).join('')}</div><div class="answer"><span class="essay">請圈選答案後，按下「統計圈選結果」</span></div></article>`).join(''):'<div class="empty">沒有符合條件的測驗題，請調整篩選條件。</div>'}
function gradePractice(){const cards=[...document.querySelectorAll('#questions .card')];if(!cards.length)return;const current=data.filter(x=>x.k==='choice'&&($('subject').value==='all'||x.s===$('subject').value)&&($('year').value==='all'||x.y===$('year').value));let answered=0,score=0;cards.forEach((card,i)=>{const picked=card.querySelector(`input[name="practice-${i}"]:checked`);if(picked){answered++;if(picked.value===current[i].a)score++}});const total=cards.length;const percent=Math.round(score/total*100);const message=score===total?'太棒了！全對，你的準備非常扎實！':score===0?'先別氣餒，全部重新整理觀念，加油！':'做得很好！再把錯題複習一次，你會越來越穩！';$('practiceResult').hidden=false;$('practiceResult').innerHTML=`<div class="result-message">${message}</div>已作答 ${answered} / ${total} 題，答對 <strong>${score} / ${total}</strong> 題（${percent} 分）`}
function quizPool(){let s=$('subject').value,y=$('year').value;return data.filter(x=>x.k==='choice'&&(s==='all'||x.s===s)&&(y==='all'||x.y===y))}
function startQuiz(){const pool=quizPool(); if(!pool.length){alert('目前篩選條件沒有測驗題，請改選其他科目或年度。');return} quizItems=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(5,pool.length));quizIndex=0;quizAnswers=[];quizSeconds=300;$('quiz').hidden=false;$('quizResult').hidden=true;$('quizStart').disabled=true;clearInterval(quizClock);quizClock=setInterval(()=>{quizSeconds--;updateTimer();if(quizSeconds<=0)finishQuiz()},1000);renderQuiz();$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}
function updateTimer(){$('timer').textContent=`${String(Math.floor(quizSeconds/60)).padStart(2,'0')}:${String(quizSeconds%60).padStart(2,'0')}`;if(quizSeconds<=30)$('timer').style.background='#f7d8d4'}
function renderQuiz(){const x=quizItems[quizIndex];$('quizProgress').textContent=`第 ${quizIndex+1} / ${quizItems.length} 題 · ${x.y} 年｜${x.s}`;$('progressBar').style.width=`${(quizIndex/quizItems.length)*100}%`;$('quizQuestion').textContent=x.q;$('quizOptions').innerHTML=x.o.map((v,i)=>`<label><input type="radio" name="quizChoice" value="${'ABCD'[i]}" ${quizAnswers[quizIndex]==='ABCD'[i]?'checked':''}>${'ABCD'[i]}．${v}</label>`).join('');$('quizNext').textContent=quizIndex===quizItems.length-1?'交卷':'下一題';updateTimer()}
function saveAnswer(){const picked=document.querySelector('input[name="quizChoice"]:checked');if(picked)quizAnswers[quizIndex]=picked.value}
function nextQuiz(){saveAnswer();if(quizIndex<quizItems.length-1){quizIndex++;renderQuiz()}else finishQuiz()}
function finishQuiz(){saveAnswer();clearInterval(quizClock);$('quizStart').disabled=false;const score=quizItems.reduce((n,x,i)=>n+(quizAnswers[i]===x.a?1:0),0);const total=quizItems.length;const percent=Math.round(score/total*100);const key='architectQuizStats';const old=JSON.parse(localStorage.getItem(key)||'{"attempts":0,"questions":0,"correct":0,"best":0}');const stats={attempts:old.attempts+1,questions:old.questions+total,correct:old.correct+score,best:Math.max(old.best,percent)};localStorage.setItem(key,JSON.stringify(stats));let message=score===total?'太棒了！全對，你的準備非常扎實！':score===0?'先別氣餒，重新整理觀念，再試一次，加油！':'做得很好！再把錯題複習一次，你會越來越穩！';$('progressBar').style.width='100%';$('quizQuestion').textContent='測驗完成';$('quizOptions').innerHTML='';$('quizNext').textContent='再測一次';$('quizNext').onclick=startQuiz;$('quizResult').hidden=false;$('quizResult').innerHTML=`<div class="result-message">${message}</div>答對 <strong>${score} / ${total}</strong> 題（${percent} 分）<div class="score-summary"><span>累計測驗 ${stats.attempts} 次</span><span>累計答題 ${stats.questions} 題</span><span>累計答對 ${stats.correct} 題</span><span>最佳成績 ${stats.best} 分</span></div><br><span class="count">${quizItems.map((x,i)=>`${i+1}：${quizAnswers[i]||'未作答'}／標準答案 ${x.a}`).join('　')}</span>`}
function exitQuiz(){clearInterval(quizClock);$('quiz').hidden=true;$('quizStart').disabled=false;$('quizNext').onclick=nextQuiz}
['subject','year','kind'].forEach(id=>$(id).addEventListener('change',()=>{ $('draw').dataset.draw='0';render()})); $('draw').addEventListener('click',()=>{$('draw').dataset.draw='1';render()}); $('gradePractice').addEventListener('click',gradePractice); $('quizStart').addEventListener('click',startQuiz); $('quizNext').addEventListener('click',nextQuiz); $('quizExit').addEventListener('click',exitQuiz); links(); render();
</script>
</body>
</html>
