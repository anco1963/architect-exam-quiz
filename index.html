<!doctype html><html lang="zh-Hant"><head>  <meta charset="utf-8" />  <meta name="viewport" content="width=device-width, initial-scale=1" />  <title>建築師考試｜113–114 題庫練習</title>  <style>    :root{--ink:#1d2b2a;--muted:#6b7772;--paper:#fbfaf6;--card:#fff;--sage:#dfe9df;--teal:#1f5d5b;--gold:#d59a4d;--line:#d9e0da;--bad:#b64b43;--good:#2c7959}    *{box-sizing:border-box}[hidden]{display:none !important}body{margin:0;color:var(--ink);background:var(--paper);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}    header{background:linear-gradient(135deg,#183f40,#2e6c67);color:white;padding:46px 6vw 42px;position:relative;overflow:hidden}header:after{content:"ARCHITECT\A EXAM";white-space:pre;position:absolute;right:7vw;bottom:-24px;font-size:64px;line-height:.86;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.08);transform:rotate(-8deg)}    .eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:12px;opacity:.72}.hero{max-width:1180px;margin:auto;position:relative;z-index:1}.hero h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(34px,5vw,64px);line-height:1.08;margin:12px 0}.hero p{max-width:650px;color:#dce9e5;margin:0;font-size:17px}    main{max-width:1180px;margin:0 auto;padding:28px 6vw 70px}.toolbar{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:12px;align-items:end;background:var(--card);border:1px solid var(--line);padding:18px;border-radius:18px;box-shadow:0 10px 30px rgba(29,43,42,.05);margin-top:-28px;position:relative;z-index:2}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;color:var(--ink);font:inherit}.btn{border:0;border-radius:10px;background:var(--teal);color:white;font-weight:700;padding:11px 16px;cursor:pointer;font:inherit}.btn.alt{background:#edf2ed;color:var(--teal)}.btn:hover{filter:brightness(1.05)}    .meta{display:flex;gap:18px;align-items:center;justify-content:space-between;margin:28px 0 14px}.meta h2{font-family:Georgia,"Noto Serif TC",serif;margin:0;font-size:24px}.count{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;min-height:280px}.tag{display:inline-flex;align-self:flex-start;background:var(--sage);color:var(--teal);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.card h3{margin:13px 0 10px;font-size:17px;line-height:1.5}.options{display:grid;gap:7px;margin:4px 0 14px}.option{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;background:#fcfdfb}.option b{display:inline-block;width:22px;color:var(--gold)}.answer{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}.answer strong{color:var(--good)}.essay{color:var(--muted);font-size:13px}.quiz{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:24px 0;box-shadow:0 10px 30px rgba(29,43,42,.06)}.quiz[hidden]{display:none}.quiz-head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.quiz-title{font-family:Georgia,"Noto Serif TC",serif;font-size:22px;margin:0}.timer{font-variant-numeric:tabular-nums;color:var(--teal);font-weight:800;background:var(--sage);padding:5px 10px;border-radius:999px}.progress{height:7px;background:#edf1ed;border-radius:99px;overflow:hidden;margin:16px 0}.progress span{display:block;height:100%;background:var(--gold);transition:width .25s}.quiz-question{font-size:19px;font-weight:700;margin:18px 0}.quiz-options{display:grid;gap:10px}.quiz-options label{border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;background:#fcfdfb}.quiz-options label:hover{border-color:var(--teal);background:#f3f8f3}.quiz-options input{margin-right:8px;accent-color:var(--teal)}.quiz-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:22px}.quiz-result{background:#eef5ee;border-radius:12px;padding:14px;margin-top:18px}.quiz-result strong{font-size:22px;color:var(--teal)}.source{margin-top:28px;background:#eef3ee;border-radius:16px;padding:18px}.source h3{margin:0 0 7px}.source p{margin:0;color:var(--muted);font-size:13px}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.links a{color:var(--teal);font-size:13px;border-bottom:1px solid #9abbb4;text-decoration:none}.empty{padding:45px;text-align:center;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}.note{font-size:12px;color:var(--muted);margin-top:20px}.brandmark{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 9px;font-size:12px;margin-left:8px}@media(max-width:820px){.toolbar{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.toolbar{grid-template-columns:1fr}.meta{align-items:flex-start;flex-direction:column}.quiz-head,.quiz-foot{align-items:flex-start;flex-direction:column}}    .result-message{font-family:Georgia,"Noto Serif TC",serif;font-size:20px;color:var(--teal);margin:4px 0 8px}.score-summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.score-summary span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;color:var(--muted)}.practice-actions{display:flex;align-items:center;gap:12px;margin:22px 0}.practice-result{background:#eef5ee;border-radius:12px;padding:14px;flex:1}.practice-result[hidden]{display:none}.practice-options label{display:block;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;background:#fcfdfb;cursor:pointer}.practice-options label:hover{border-color:var(--teal);background:#f3f8f3}.practice-options input{margin-right:8px;accent-color:var(--teal)}.mode-picker{max-width:760px;margin:0 auto 22px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;box-shadow:0 10px 30px rgba(29,43,42,.05)}.mode-picker h2{font-family:Georgia,"Noto Serif TC",serif;margin:0 0 5px}.mode-picker p{margin:0 0 16px;color:var(--muted);font-size:14px}.mode-picker .btn{min-width:150px;margin:4px}.mode-status{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;padding:10px 14px;border-radius:12px;background:var(--sage);color:var(--teal);font-weight:700}.mode-status button{border:0;background:transparent;color:var(--teal);text-decoration:underline;cursor:pointer;font:inherit}.question-image{display:block;max-width:100%;max-height:360px;object-fit:contain;margin:10px 0 14px;border:1px solid var(--line);border-radius:10px;background:#fff}.question-pdf{display:block;width:100%;height:420px;margin:10px 0 14px;border:1px solid var(--line);border-radius:10px;background:#fff}.image-note{font-size:12px;color:var(--muted);margin:8px 0}  </style></head><body><header><div class="hero"><div class="eyebrow">ARCHITECT EXAM ARCHIVE <span class="brandmark">113 — 114</span></div><h1>建築師考試<br>題庫練習室</h1><p>以考選部公開試題為索引，整理四科非設計類科的題目與標準答案。選科目、選年度，立即自由出題。</p></div></header><main>  <section class="mode-picker" id="modePicker" aria-label="選擇測驗模式"><h2>先選擇測驗方式</h2><p>請先選擇一種模式；進入後只會顯示目前選定的測驗。</p><button class="btn" id="chooseDraw" onclick="selectMode('draw')">自由出題</button><button class="btn alt" id="chooseQuiz" onclick="selectMode('quiz')">即時測驗</button></section><div class="mode-status" id="modeStatus" hidden><span id="modeLabel"></span><button id="changeMode" onclick="resetMode()">重新選擇模式</button></div><section class="toolbar" aria-label="題庫篩選">    <div class="field"><label for="subject">科目</label><select id="subject"><option value="all">全部科目</option><option>營建法規與實務</option><option>建築結構</option><option>建築構造與施工</option><option>建築環境控制</option></select></div>    <div class="field"><label for="year">年度</label><select id="year"><option value="all">113、114 年</option><option value="114">114 年</option><option value="113">113 年</option></select></div>    <div class="field"><label for="kind">題型</label><select id="kind"><option value="all">全部測驗題</option><option value="choice">測驗題</option></select></div>    <button class="btn" id="draw" hidden>自由出題</button>    <button class="btn alt" id="quizStart" hidden>即時測驗</button>  </section>  <section class="quiz" id="quiz" hidden aria-live="polite">    <div class="quiz-head"><h2 class="quiz-title">即時測驗</h2><div class="timer" id="timer">05:00</div></div>    <div class="progress"><span id="progressBar" style="width:0%"></span></div>    <div class="count" id="quizProgress"></div>    <div class="quiz-question" id="quizQuestion"></div>    <div class="quiz-options" id="quizOptions"></div>    <div class="quiz-foot"><button class="btn alt" id="quizExit">返回題庫</button><button class="btn" id="quizNext">下一題</button></div>    <div class="quiz-result" id="quizResult" hidden></div>  </section>  <div class="meta" id="bankMeta"><h2 id="title">全部題庫</h2><div class="count" id="count"></div></div>
